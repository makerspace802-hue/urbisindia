  <script>
    // Apply the stored theme before first paint so the page never flashes
    // light when dark is selected (or vice versa).
    (function () {
      try {
        var stored = window.localStorage.getItem("urbis.theme");
        var theme = stored === "light" || stored === "dark" ? stored : "dark";
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
      } catch (error) {
        // Storage blocked; the React provider will still set the class.
      }
    })();
  </script>
